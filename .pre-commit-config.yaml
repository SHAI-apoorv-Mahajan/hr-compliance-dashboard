repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        files: ^backend/.*\.py$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.7
    hooks:
      - id: ruff
        files: ^backend/.*\.py$
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^frontend/src/.*\.(js|jsx|ts|tsx|json|css|md)$
        additional_dependencies:
          - prettier@3.3.2

  - repo: local
    hooks:
      - id: forbid-env-files
        name: forbid committing .env files
        entry: forbidden — .env files must not be committed
        language: fail
        files: ^(\.env|\.env\.[^.]+|.*/\.env|.*/\.env\.[^.]+)$
        exclude: ^\.env\.example$

      - id: reconcile-claude-settings
        name: reconcile .claude/settings.json with template
        entry: bash -c 'cp .claude/settings.json.template .claude/settings.json && git add .claude/settings.json'
        language: system
        files: ^\.claude/settings\.json(\.template)?$
        pass_filenames: false
