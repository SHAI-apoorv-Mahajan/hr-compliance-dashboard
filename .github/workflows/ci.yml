name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest black ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Run tests
        env:
          # Tests must run without real Supabase credentials.
          # Foundation US-002 / US-004 set up the test database fixture.
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL || 'postgresql+psycopg2://postgres:postgres@localhost:5432/test' }}
          SECRET_KEY: ci_test_secret_key_not_for_production
          ACCESS_TOKEN_EXPIRE_HOURS: "24"
          GRAPH_TENANT_ID: ""
          GRAPH_CLIENT_ID: ""
          GRAPH_CLIENT_SECRET: ""
          GRAPH_SENDER_EMAIL: ""
          CORS_ORIGINS: http://localhost:3000
        run: pytest -q

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format check (prettier)
        run: npx prettier --check "src/**/*.{js,jsx,ts,tsx,json,css,md}"

      - name: Run tests
        run: npm test --silent

      - name: Build
        run: npm run build

  docker:
    name: Docker compose validates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet
